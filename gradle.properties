# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRclass=true
kotlin.code.style=official

# This project lives inside a OneDrive-synced folder. OneDrive briefly locks
# files it is syncing, which races with Gradle's file-system watcher and
# causes intermittent "AccessDeniedException" failures when Gradle tries to
# clean up build outputs (e.g. compileDebugKotlin). Disabling VFS watching
# avoids that race.
org.gradle.vfs.watch=false
